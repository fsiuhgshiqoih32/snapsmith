name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      SNAPSMITH_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
          rustflags: ""

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libwayland-dev \
            libegl1-mesa-dev libgbm-dev libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri xvfb

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Self-test
        if: runner.os != 'Linux'
        run: cargo run --locked -- --self-test

      - name: Self-test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo run --locked -- --self-test
